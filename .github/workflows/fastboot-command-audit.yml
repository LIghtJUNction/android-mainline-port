name: Fastboot command audit
on: [push, pull_request]
permissions:
  contents: read
jobs:
  synthetic-command-tables:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m unittest discover -s tools/lg-g8/local-sim/fastboot -p 'test_*.py' -v
